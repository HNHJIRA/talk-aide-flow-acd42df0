[package]
name = "interviewcopilot-companion"
version = "0.1.0"
description = "InterviewCopilot Desktop Companion - native meeting audio bridge"
authors = ["InterviewCopilot"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
rubato = "0.15"
cpal = "0.15"
crossbeam-channel = "0.5"
parking_lot = "0.12"
sysinfo = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
once_cell = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
os_info = "3"

[target.'cfg(windows)'.dependencies]
wasapi = "0.15"
windows = { version = "0.56", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8.0.1", features = ["macos_13_0"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Development build mode: verbose, human-readable native diagnostics
# (target/file/line/thread console logs + 2s native audio heartbeat).
dev-diagnostics = []
# Compile-time guarantee that a real native capture backend was selected
# (WASAPI on Windows, ScreenCaptureKit on macOS) - never the Unsupported stub.
require-native-backend = []


